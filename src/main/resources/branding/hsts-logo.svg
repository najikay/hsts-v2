<?xml version="1.0" encoding="UTF-8"?>
<!--
  HSTS brand mark: an "A+" grade glyph on the app's indigo gradient tile
  (logo-directions review, 2026-08-19). Own geometry, no third-party asset.
  Mirrors the in-app vector logo in client.ui.components.Logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="hstsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4263eb"/>
      <stop offset="1" stop-color="#5c7cfa"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="20" fill="url(#hstsGrad)"/>
  <g transform="translate(18.25 18.25) scale(2.48)"
     fill="none" stroke="#ffffff"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 19 10.5 5.5 16 19M6.9 14.2H14.1" stroke-width="2.6"/>
    <path d="M19.2 6.2V10.8M16.9 8.5H21.5" stroke-width="2.2"/>
  </g>
</svg>
